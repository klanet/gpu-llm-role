---
- name: Check supported OS
  ansible.builtin.assert:
    that:
      - ansible_distribution == 'Ubuntu'
      - ansible_distribution_version is version('22.04', '>=')
    fail_msg: "Поддерживается Ubuntu 22.04+"

- name: Install base packages
  ansible.builtin.apt:
    name: [ca-certificates, curl, gnupg, pciutils, ufw, jq, openssl, linux-headers-generic, unattended-upgrades]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Verify NVIDIA GPU is present on PCI bus
  ansible.builtin.shell: lspci | grep -i 'nvidia'
  register: gpu_pci
  changed_when: false
  failed_when: gpu_pci.rc != 0

- name: Verify API keys are configured
  ansible.builtin.assert:
    that:
      - llm_api_keys is defined
      - llm_api_keys | length > 0
      - "'REPLACE-ME' not in (llm_api_keys | join(','))"
    fail_msg: "Задайте llm_api_keys в group_vars/gpu_servers/vault.yml"
  no_log: true

- name: Do not auto-upgrade GPU stack (driver/Docker upgrades only via playbook)
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52-gpu-blacklist
    mode: "0644"
    content: |
      Unattended-Upgrade::Package-Blacklist {
        "nvidia-";
        "libnvidia-";
        "linux-modules-nvidia-";
        "docker-ce";
        "containerd.io";
      };

- name: UFW - allow SSH
  community.general.ufw:
    rule: allow
    port: "{{ ssh_port }}"
    proto: tcp
  when: ufw_enabled

- name: UFW - allow API port
  community.general.ufw:
    rule: allow
    port: "{{ api_port }}"
    proto: tcp
  when: ufw_enabled

- name: UFW - enable, deny incoming by default
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming
  when: ufw_enabled
