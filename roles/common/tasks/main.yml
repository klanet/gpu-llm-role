---
- name: Include distro-specific variables
  ansible.builtin.include_vars:
    file: distro.yml
    name: distro

- name: Check supported OS family
  ansible.builtin.assert:
    that:
      - ansible_os_family in distro.__distro_packages
    fail_msg: "Поддерживаемые OS family: {{ distro.__distro_packages.keys() | list }}. Текущий: {{ ansible_os_family }}"

- name: Install base packages
  ansible.builtin.package:
    name: "{{ distro.__distro_packages[ansible_os_family].base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Verify NVIDIA GPU is present on PCI bus
  ansible.builtin.shell: lspci | grep -i 'nvidia'
  register: gpu_pci
  changed_when: false
  failed_when: gpu_pci.rc != 0

- name: Verify API keys are configured
  ansible.builtin.assert:
    that:
      - llm_api_keys is defined
      - llm_api_keys | length > 0
      - "'REPLACE-ME' not in (llm_api_keys | join(','))"
    fail_msg: "Задайте llm_api_keys в group_vars/gpu_servers/vault.yml"
  no_log: true

- name: Validate Ollama model name format (must be tag like 'qwen2.5:7b-instruct', not HF ID)
  ansible.builtin.assert:
    that:
      - llm_engine != 'ollama' or (llm_model is search(':'))
    fail_msg: "Для Ollama укажите тег модели (например 'qwen2.5:7b-instruct'), а не HF ID"
  when: llm_engine == 'ollama'

- name: Validate vLLM model name format (must be HF ID like 'org/model', not tag)
  ansible.builtin.assert:
    that:
      - llm_engine != 'vllm' or (llm_model is search('/'))
    fail_msg: "Для vLLM укажите HF ID модели (например 'Qwen/Qwen2.5-7B-Instruct-AWQ'), а не тег"
  when: llm_engine == 'vllm'

- name: Do not auto-upgrade GPU stack (driver/Docker upgrades only via playbook)
  ansible.builtin.copy:
    dest: "{{ distro.__distro_packages[ansible_os_family].unattended_upgrades_config }}"
    mode: "0644"
    content: |
      {% if ansible_os_family == 'Debian' %}
      Unattended-Upgrade::Package-Blacklist {
        "nvidia-";
        "libnvidia-";
        "linux-modules-nvidia-";
        "docker-ce";
        "containerd.io";
      };
      {% elif ansible_os_family == 'RedHat' %}
      [commands]
      exclude = nvidia-*,libnvidia-*,docker-*,containerd.io
      {% endif %}
  when: distro.__distro_packages[ansible_os_family].unattended_upgrades_config != ""

- name: Install firewall packages
  ansible.builtin.package:
    name: "{{ distro.__distro_packages[ansible_os_family].firewall_packages }}"
    state: present
  when: ufw_enabled or firewalld_enabled

- name: Configure UFW (Debian/Ubuntu/Arch)
  block:
    - name: UFW - allow SSH
      community.general.ufw:
        rule: allow
        port: "{{ ssh_port }}"
        proto: tcp

    - name: UFW - allow API port
      community.general.ufw:
        rule: allow
        port: "{{ api_port }}"
        proto: tcp

    - name: UFW - enable, deny incoming by default
      community.general.ufw:
        state: enabled
        policy: deny
        direction: incoming
  when: ufw_enabled

- name: Configure firewalld (RHEL/CentOS/Fedora)
  block:
    - name: firewalld - allow SSH
      ansible.posix.firewalld:
        port: "{{ ssh_port }}/tcp"
        permanent: true
        immediate: true
        state: enabled

    - name: firewalld - allow API port
      ansible.posix.firewalld:
        port: "{{ api_port }}/tcp"
        permanent: true
        immediate: true
        state: enabled

    - name: firewalld - enable and start
      ansible.builtin.systemd:
        name: firewalld
        enabled: true
        state: started
  when: firewalld_enabled