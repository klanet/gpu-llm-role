---
- name: Include distro-specific variables
  ansible.builtin.include_vars:
    file: distro.yml
    name: distro

- name: Create keyrings dir (Debian/Ubuntu)
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  when: ansible_os_family == 'Debian'

- name: Add Docker GPG key (Debian/Ubuntu)
  ansible.builtin.get_url:
    url: "{{ distro.__distro_packages[ansible_os_family].docker_gpg_url }}"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
  when: ansible_os_family == 'Debian' and distro.__distro_packages[ansible_os_family].docker_gpg_url != ""

- name: Add Docker apt repository (Debian/Ubuntu)
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }} signed-by=/etc/apt/keyrings/docker.asc] {{ distro.__distro_packages[ansible_os_family].docker_repo_url }} {{ ansible_distribution_release }} stable"
    filename: docker
    state: present
  when: ansible_os_family == 'Debian' and distro.__distro_packages[ansible_os_family].docker_repo_url != ""

- name: Add Docker dnf/yum repository (RHEL/Fedora)
  ansible.builtin.dnf:
    name: "{{ distro.__distro_packages[ansible_os_family].docker_repo_url }}/docker-ce.repo"
    state: present
  when: ansible_os_family == 'RedHat'
  # Note: For RHEL, better to use the official install script or repo file

- name: Add NVIDIA Container Toolkit GPG key (Debian/Ubuntu)
  ansible.builtin.get_url:
    url: "{{ distro.__distro_packages[ansible_os_family].nvidia_ctk_gpg_url }}"
    dest: /etc/apt/keyrings/nvidia-container-toolkit.asc
    mode: "0644"
  when: ansible_os_family == 'Debian' and distro.__distro_packages[ansible_os_family].nvidia_ctk_gpg_url != ""

- name: Add NVIDIA Container Toolkit apt repository (Debian/Ubuntu)
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/nvidia-container-toolkit.asc] {{ distro.__distro_packages[ansible_os_family].nvidia_ctk_repo_url }}"
    filename: nvidia-container-toolkit
    state: present
  when: ansible_os_family == 'Debian' and distro.__distro_packages[ansible_os_family].nvidia_ctk_repo_url != ""

- name: Add NVIDIA Container Toolkit dnf/yum repository (RHEL/Fedora)
  ansible.builtin.dnf:
    name: "{{ distro.__distro_packages[ansible_os_family].nvidia_ctk_repo_url }}/nvidia-container-toolkit.repo"
    state: present
  when: ansible_os_family == 'RedHat'

- name: Install Docker and NVIDIA Container Toolkit
  ansible.builtin.package:
    name: "{{ distro.__distro_packages[ansible_os_family].docker_packages + distro.__distro_packages[ansible_os_family].nvidia_ctk_packages }}"
    state: present
    update_cache: true

- name: Check if nvidia runtime is registered in Docker
  ansible.builtin.command: grep -q nvidia /etc/docker/daemon.json
  register: docker_nvidia_cfg
  changed_when: false
  failed_when: false

- name: Configure Docker to use NVIDIA runtime
  ansible.builtin.command: nvidia-ctk runtime configure --runtime=docker
  when: docker_nvidia_cfg.rc != 0
  notify: restart docker

- name: Enable and start Docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Apply Docker restart now
  ansible.builtin.meta: flush_handlers

- name: Test GPU access from a container
  ansible.builtin.command: docker run --rm --gpus all {{ cuda_test_image }} nvidia-smi -L
  register: docker_gpu_test
  changed_when: false
  retries: 3
  delay: 10
  until: docker_gpu_test.rc == 0