---
- name: Create stack directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ llm_dir }}"
    - "{{ llm_dir }}/hf-cache"
    - "{{ llm_dir }}/ollama"
    - "{{ llm_dir }}/nginx"
    - "{{ llm_dir }}/certs"

- name: Generate self-signed TLS certificate (replace with a real one in production)
  ansible.builtin.command: >
    openssl req -x509 -nodes -newkey rsa:4096 -days 365
    -subj "/CN={{ inventory_hostname }}"
    -keyout {{ llm_dir }}/certs/tls.key -out {{ llm_dir }}/certs/tls.crt
  args:
    creates: "{{ llm_dir }}/certs/tls.crt"
  when: api_tls_enabled

- name: Render .env (secrets)
  ansible.builtin.copy:
    dest: "{{ llm_dir }}/.env"
    mode: "0600"
    content: |
      HF_TOKEN={{ hf_token | default('') }}
  no_log: true

- name: Render nginx config (API-key auth, rate limit, streaming)
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: "{{ llm_dir }}/nginx/default.conf"
    mode: "0600"
  no_log: true

- name: Render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ llm_dir }}/docker-compose.yml"
    mode: "0644"

- name: Start the stack (restart policy gives autostart on boot)
  community.docker.docker_compose_v2:
    project_src: "{{ llm_dir }}"
    state: present
    pull: missing
    remove_orphans: true

- name: Pull Ollama model
  ansible.builtin.shell: |
    set -e
    if docker exec llm ollama list | grep -qF "{{ llm_model }}"; then echo present
    else docker exec llm ollama pull "{{ llm_model }}"; fi
  args:
    executable: /bin/bash
  register: ollama_pull
  changed_when: "'present' not in ollama_pull.stdout"
  retries: 10
  delay: 6
  until: ollama_pull.rc == 0
  when: llm_engine == 'ollama'

- name: Check GPU memory before deploy (warn if less than 16GB for 7B models)
  ansible.builtin.command: nvidia-smi --query-gpu=memory.total --format=csv,noheader,nounits
  register: gpu_mem
  changed_when: false
  failed_when: false

- name: Warn if GPU memory may be insufficient
  ansible.builtin.debug:
    msg: "ВНИМАНИЕ: GPU VRAM {{ gpu_mem.stdout }} МБ — для 7B модели (fp16/AWQ) рекомендуется 16+ ГБ"
  when: gpu_mem.stdout is defined and gpu_mem.stdout | int < 15000

- name: Wait for gateway port
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ api_port }}"
    timeout: 120

- name: Wait until model is loaded (first start downloads weights - can take 10+ min)
  ansible.builtin.uri:
    url: "{{ api_scheme }}://127.0.0.1:{{ api_port }}/v1/models"
    headers:
      Authorization: "Bearer {{ llm_api_keys | first }}"
    validate_certs: false
    status_code: 200
  register: models_check
  retries: 120
  delay: 10
  until: models_check.status == 200
  no_log: true

- name: Smoke test - real chat completion through the gateway
  ansible.builtin.uri:
    url: "{{ api_scheme }}://127.0.0.1:{{ api_port }}/v1/chat/completions"
    method: POST
    headers:
      Authorization: "Bearer {{ llm_api_keys | first }}"
    body_format: json
    body:
      model: "{{ llm_model }}"
      messages:
        - { role: user, content: "Reply with the single word: OK" }
      max_tokens: 8
    validate_certs: false
    timeout: 180
    status_code: 200
  register: smoke
  no_log: true

- name: Check that unauthenticated requests are rejected
  ansible.builtin.uri:
    url: "{{ api_scheme }}://127.0.0.1:{{ api_port }}/v1/models"
    validate_certs: false
    status_code: 401

- name: Install watchdog script
  ansible.builtin.template:
    src: llm-healthcheck.sh.j2
    dest: /usr/local/bin/llm-healthcheck
    mode: "0700"
  no_log: true

- name: Install watchdog systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop: [llm-healthcheck.service, llm-healthcheck.timer]

- name: Enable watchdog timer
  ansible.builtin.systemd:
    name: llm-healthcheck.timer
    enabled: true
    state: started
    daemon_reload: true
